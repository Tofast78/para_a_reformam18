<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem para a Reforma M18 </title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        background: #121212;
        color: #ffffff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 10px;
    }

    .container {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        max-width: 500px;
        width: 100%;
        text-align: center;
    }

    h1 {
        color: #4fc3f7;
        margin-top: 0;
    }

    p {
        margin: 15px 0;
    }

    .input-group {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 20px 0;
    }

    input[type="date"] {
        padding: 12px;
        border: 2px solid #2d2d2d;
        border-radius: 8px;
        background: #2d2d2d;
        color: white;
        font-size: 1em;
        transition: border-color 0.3s;
        cursor: pointer;
    }

    input[type="date"]:focus {
        outline: none;
        border-color: #4fc3f7;
    }

    input[type="number"] {
        width: 80px;
        padding: 12px;
        border: 2px solid #2d2d2d;
        border-radius: 8px;
        text-align: center;
        background: #2d2d2d;
        color: white;
        font-size: 1em;
        transition: border-color 0.3s;
    }

    input[type="number"]:focus {
        outline: none;
        border-color: #4fc3f7;
    }

    input::placeholder {
        color: #888;
    }

    .info-text {
        font-size: 0.9em;
        color: #aaa;
        margin-top: 10px;
        margin-bottom: 15px;
    }

    button {
        margin-top: 15px;
        padding: 14px 30px;
        border: none;
        border-radius: 8px;
        background: #4fc3f7;
        color: black;
        font-weight: bold;
        font-size: 1em;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover {
        background: #81d4fa;
    }

    button:active {
        transform: scale(0.98);
    }

    #resultado {
        margin-top: 25px;
        font-size: 1.2em;
        line-height: 1.8;
        min-height: 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .frase {
        margin-top: 15px;
        color: #ffd54f;
        font-style: italic;
        padding: 10px;
        border-left: 3px solid #ffd54f;
        text-align: left;
    }

    .erro {
        color: #ff6b6b;
        margin-top: 15px;
    }

    .sucesso {
        color: #51cf66;
        font-weight: bold;
        font-size: 1.3em;
    }

    @media (max-width: 480px) {
        .container {
            padding: 20px;
        }

        input[type="date"] {
            width: 100%;
        }

        button {
            padding: 12px 24px;
        }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Quanto Falta para a Reforma?</h1>

    <p>Insira a sua data de nascimento:</p>

    <div class="input-group">
        <input type="date" id="dataNascimento" aria-label="Data de nascimento">
    </div>

    <div class="info-text">
    M18
    </div>

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>
</div>

<script>
// Array de frases
const FRASES = [
    "Conta os dias para a reforma, seu escravo moderno. A vida já te passou ao lado há 20 anos.",
    "Sonhas com a reforma? Relaxa, ainda vais chupar mais uns quantos anos de caralho a esta empresa.",
    "Faltam X dias para a reforma. Até lá continua a dar o cu por um salário de merda.",
    "Estás a guardar energias para a reforma? Engraçado, o teu corpo já desistiu há muito tempo.",
    "Reforma é o novo nome para 'finalmente vou poder viver depois de me foderem durante 40 anos'.",
    "Conta os dias, palhaço. Enquanto isso, o patrão conta o dinheiro que tu geras.",
    "Quando chegares à reforma vais ter dinheiro para o cemitério e tempo para te arrependeres.",
    "Trabalha mais um bocadinho, guerreiro. A reforma é para quem sobrevive.",
    "Sonhar com a reforma é o ópio do trabalhador. Continua a inalar.",
    "Faltam X dias para parares de ser escravo. Spoiler: vais continuar pobre e fodido.",
    "A reforma não é o fim do trabalho, é o início de te perguntares porque caralho perdeste a vida toda.",
    "Continua a marcar o calendário, otário. O tempo passa, tu envelheces e a empresa contrata outro burro.",
    "Estás ansioso pela reforma? Calma, ainda tens tempo para mais depressão, burnout e humilhações.",
    "Reforma = finalmente poder cagar sem pedir autorização ao chefe. Sonha alto.",
    "Trabalha hoje para descansar amanhã. Amanhã já estás velho e com a próstata no cu.",
    "Conta os dias para a liberdade… que vai durar o tempo que o teu corpo aguentar.",
    "A melhor parte da reforma é perceberes que desperdiçaste a tua vida por uma pensão de merda.",
    "Continua a sorrir para o chefe. Ele vai-se reformar rico, tu vais-te reformar cansado.",
    "Faltam X dias para a reforma. Depois podes finalmente fingir que viveste.",
    "Parabéns, estás quase a deixar de ser uma puta do sistema. Bem-vindo à velhice pobre."
];

function calcular() {
    const dataNascimentoInput = document.getElementById("dataNascimento").value;

    // Validação: verificar se foi inserida uma data
    if (!dataNascimentoInput) {
        document.getElementById("resultado").innerHTML = 
            '<div class="erro">⚠️ Por favor, insira a sua data de nascimento!</div>';
        return;
    }

    // Converter a data de nascimento
    const dataNascimento = new Date(dataNascimentoInput);
    const hoje = new Date();

    // Validação: verificar se a data é válida e no passado
    if (dataNascimento > hoje) {
        document.getElementById("resultado").innerHTML = 
            '<div class="erro">⚠️ A data de nascimento deve ser no passado!</div>';
        return;
    }

    // Calcular a data de reforma (66 anos e 7 meses)
    const dataReforma = new Date(
        dataNascimento.getFullYear() + 66,
        dataNascimento.getMonth() + 7,
        dataNascimento.getDate()
    );

    // Se já passou da data de reforma
    if (dataReforma <= hoje) {
        document.getElementById("resultado").innerHTML = 
            '<div class="sucesso">🎉 Já atingiu a idade de reforma!</div>';
        return;
    }

    // Calcular diferença em anos, meses e dias
    let anos = dataReforma.getFullYear() - hoje.getFullYear();
    let meses = dataReforma.getMonth() - hoje.getMonth();
    let dias = dataReforma.getDate() - hoje.getDate();

    // Ajustar se os dias forem negativos
    if (dias < 0) {
        meses--;
        const mesAnterior = new Date(dataReforma.getFullYear(), dataReforma.getMonth(), 0);
        dias += mesAnterior.getDate();
    }

    // Ajustar se os meses forem negativos
    if (meses < 0) {
        anos--;
        meses += 12;
    }

    // Selecionar frase aleatória
    const frase = FRASES[Math.floor(Math.random() * FRASES.length)];

    // Montar mensagem
    const mensagem = `
        <strong>Faltam:</strong><br>
        ${anos} anos, ${meses} meses e ${dias} dias
        <div class="frase">"${frase}"</div>
    `;

    document.getElementById("resultado").innerHTML = mensagem;
}

// Permitir calcular ao pressionar Enter
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById("dataNascimento").addEventListener('keypress', function(e) {
        if (e.key === 'Enter') calcular();
    });
});
</script>

</body>
</html>
